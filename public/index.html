<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; }
    li { padding: 6px 0; cursor: pointer; }
    li.done { text-decoration: line-through; color: #888; }
    #version { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Taskboard test</h1>
  <form id="new-task">
    <input id="title" placeholder="New task" maxlength="100" required>
    <button>Add</button>
  </form>
  <ul id="tasks"></ul>
  <p id="version"></p>
  <script src="app.js"></script>
</body>
</html>
