name: ci
on
 push: 
  branches: [main]
 pull_request:
jobs:
 lint-and-test:
  run-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
       node-version: 20
   - name: install
   - run: npm ci
   - run: npm lint
   - run: npm test
 build-and-push:
  needs: lint-and-test
  if: github.ref == 'ref/heads/main'
  run-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: 
      node-version: 20
   - run: npm ci
   - run: npm run build